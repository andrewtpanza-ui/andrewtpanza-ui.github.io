<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Box model</title>
		<script src="../validate.js"></script>
	<style>
		#red{
			border: 2px black solid;
			width:100px;
			background-color:red;
			height:100px;
			margin-left:300px;	
			background-clip:content-box;	
	}
		#blue{
			border: 2px black solid;
			width:100px;
			background-color:blue;
			margin-left:400px;
			padding:100px;
			background-clip:content-box;
			height:100px;
		}

			padding-left:20px;
			background-clip:content-box;
			height:100px;

			margin-left:190px;
